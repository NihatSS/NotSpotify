<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | PulseStream</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <a class="brand" href="index.html"><span class="brand-mark">P</span><span>PulseStream</span></a>
    <a class="secondary-button auth-back" href="index.html">Back to Home</a>
    <h1>Welcome back</h1>
    <form id="loginForm" class="auth-form">
      <label>Email<input type="email" id="loginEmail" required /></label>
      <label>Password<input type="password" id="loginPassword" required /></label>
      <button class="primary-button" type="submit">Login</button>
    </form>
    <p>New here? <a href="signup.html">Create an account</a></p>
    <a class="ghost-button auth-wide" href="index.html">Continue as Guest</a>
  </main>
  <div class="toast-stack" id="toastStack"></div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
