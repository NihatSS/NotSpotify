<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artist Studio | PulseStream</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="studio-shell">
    <header class="studio-head">
      <a class="brand" href="index.html"><span class="brand-mark">P</span><span>PulseStream</span></a>
      <a class="secondary-button" href="index.html">Back to app</a>
    </header>
    <section class="studio-grid">
      <form id="uploadForm" class="upload-panel">
        <p class="eyebrow">Artist Studio</p>
        <h1>Upload a song</h1>
        <label>Song title<input id="uploadTitle" required /></label>
        <label>Artist name<input id="uploadArtist" required /></label>
        <label>Album<input id="uploadAlbum" required /></label>
        <label>Genre<input id="uploadGenre" required /></label>
        <label>MP3 file<input id="uploadAudio" type="file" accept="audio/mpeg,audio/mp3,audio/*" required /></label>
        <label>Cover image<input id="uploadCover" type="file" accept="image/*" /></label>
        <button class="primary-button" type="submit">Publish Song</button>
      </form>
      <section class="upload-panel">
        <p class="eyebrow">Manage</p>
        <h2>Your uploads</h2>
        <div id="uploadedSongs" class="queue-list"></div>
      </section>
    </section>
  </main>
  <div class="toast-stack" id="toastStack"></div>
  <script type="module" src="js/upload.js"></script>
</body>
</html>
